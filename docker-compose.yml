services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - INSTA_USER=${INSTA_USER}
      - INSTA_PASS=${INSTA_PASS}
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-doodlecloud}
      - DB_USER=${DB_USER:-doodlecloud}
      - DB_PASS=${DB_PASS}
      - DB_PORT=5432
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    volumes:
      - ./upload:/app/upload
      - ./download:/app/download
      - ./auth_cache:/app/auth_cache
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - doodlecloud-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-doodlecloud}
      - POSTGRES_USER=${DB_USER:-doodlecloud}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-doodlecloud}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - doodlecloud-network

volumes:
  postgres-data:

networks:
  doodlecloud-network:
    driver: bridge
